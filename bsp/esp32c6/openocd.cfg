# ZenRTOS OpenOCD Configuration for ESP32-C6 Built-in USB-JTAG (303a:1001)
# Works out-of-the-box with standard upstream OpenOCD 0.12.0+

adapter driver esp_usb_jtag
espusbjtag vid_pid 0x303a 0x1001
espusbjtag caps_descriptor 0x2000
adapter speed 2000

jtag newtap esp32c6 cpu -irlen 5 -expected-id 0x0000dc25
target create esp32c6.cpu riscv -chain-position esp32c6.cpu -coreid 0
