# OpenOCD Configuration for NXP MIMXRT1020-EVK (i.MX RT1021, ARM Cortex-M7)
# Uses the onboard OpenSDA CMSIS-DAP debug probe over SWD.

source [find interface/cmsis-dap.cfg]
transport select swd

adapter speed 1000

set CHIPNAME mimxrt1021
swd newdap $CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu cortex_m -dap $CHIPNAME.dap

reset_config srst_only
cortex_m reset_config sysresetreq
